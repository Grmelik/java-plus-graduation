server:
  port: 8080

spring:
  application:
    name: gateway-server
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
          lower-case-service-id: true
      routes:
        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/admin/users/**
          filters:
            - StripPrefix=0

        - id: request_service
          uri: lb://REQUEST-SERVICE
          predicates:
            - Path=/internal/requests/**,/users/*/requests/**,/users/*/events/*/requests/**
          filters:
            - StripPrefix=0

        - id: event_service
          uri: lb://EVENT-SERVICE
          predicates:
            - Path=/admin/events/**,/events/**,/users/*/events/**,/admin/categories/**,/categories/**,/admin/compilations/**,/compilations/**
          filters:
            - StripPrefix=0

        - id: comment_service
          uri: lb://COMMENT-SERVICE
          predicates:
            - Path=/admin/comments/**,/users/*/comments/**,/users/*/events/*/comments/**,/events/*/comments/**
          filters:
            - StripPrefix=0

management:
  endpoints:
    web:
      exposure:
        include: gateway, health, info, routes

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.cloud.loadbalancer: DEBUG